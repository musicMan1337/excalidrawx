output:
  - failure
  - execution_out

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.server.json
    lint:
      run: npx eslint {staged_files} --no-warn-ignored
      glob: '*.{ts,tsx}'
    format:
      run: npx prettier --check {staged_files}
      glob: '*.{ts,tsx,json,js,md,yml,yaml,css,html}'

post-checkout:
  commands:
    agent-symlinks:
      run: bash scripts/setup-agent-symlinks.sh
